<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Moring Suksok app icon — moringa leaf on green background -->
  <rect width="512" height="512" rx="96" fill="#2D6A4F"/>
  <!-- Stylized moringa leaf -->
  <g transform="translate(256, 256)">
    <!-- Leaf stem -->
    <path d="M 0 80 L 0 -20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Leaf body (teardrop shape) -->
    <path d="M 0 -100 C -60 -100 -90 -50 -90 0 C -90 50 -50 80 0 80 C 50 80 90 50 90 0 C 90 -50 60 -100 0 -100 Z" fill="#52B788"/>
    <!-- Leaf vein center -->
    <path d="M 0 -90 L 0 70" stroke="#1B4332" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Leaf vein left -->
    <path d="M 0 -50 Q -30 -30 -50 -10" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 0 -20 Q -35 0 -55 20" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 0 10 Q -30 30 -45 45" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Leaf vein right -->
    <path d="M 0 -50 Q 30 -30 50 -10" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 0 -20 Q 35 0 55 20" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 0 10 Q 30 30 45 45" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
